name: Release

# Push a tag like v0.2.0 (matching package.json) to publish a prebuilt binary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # linux-x64 only: bun install fetches OpenTUI's native library for the runner's own platform, so a
      # cross-built arm64 binary would ship without it.
      - name: Build
        run: |
          bun scripts/build.ts --target bun-linux-x64 --outfile dist/kindroid-tui-linux-x64
          ./dist/kindroid-tui-linux-x64 --version
          cd dist && sha256sum kindroid-tui-linux-x64 > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/kindroid-tui-linux-x64 dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
